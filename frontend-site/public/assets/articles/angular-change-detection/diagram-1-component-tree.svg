<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#0f0f17; border-radius:16px; font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="brandGrad1b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9678fb"/>
      <stop offset="100%" stop-color="#e3a3ff"/>
    </linearGradient>
    <filter id="shadow1b" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow1b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9678fb"/>
    </marker>
    <marker id="arrowMuted1b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title Left Aligned with plenty of space -->
  <text x="50" y="44" fill="#ffffff" font-size="19" font-weight="700">Top-Down View Tree Traversal Flow</text>
  <text x="50" y="68" fill="#94a3b8" font-size="13">Unidirectional data flow: distinguishing checked views from skipped subtrees</text>

  <!-- Root Component (Centered horizontally at x=390, width=220) -->
  <g transform="translate(390, 105)" filter="url(#shadow1b)">
    <rect width="220" height="66" rx="10" fill="#1e1e30" stroke="#9678fb" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="66" rx="3" fill="url(#brandGrad1b)"/>
    <text x="20" y="28" fill="#ffffff" font-size="14" font-weight="700">Root Component</text>
    <text x="20" y="48" fill="#a78bfa" font-size="12" font-family="monospace">AppComponent (LView 0)</text>
    <circle cx="195" cy="33" r="7" fill="#10b981"/>
  </g>

  <!-- Flow Arrows from Root -->
  <path d="M 450 171 L 280 235" fill="none" stroke="#9678fb" stroke-width="2" marker-end="url(#arrow1b)"/>
  <path d="M 550 171 L 720 235" fill="none" stroke="#9678fb" stroke-width="2" marker-end="url(#arrow1b)"/>

  <!-- Child A: Header View (Default Strategy) -->
  <g transform="translate(150, 235)" filter="url(#shadow1b)">
    <rect width="260" height="76" rx="10" fill="#1e1e30" stroke="#334155" stroke-width="1.5"/>
    <text x="18" y="26" fill="#ffffff" font-size="14" font-weight="600">Header / Navigation View</text>
    <text x="18" y="46" fill="#94a3b8" font-size="12" font-family="monospace">Default Strategy</text>
    <text x="18" y="64" fill="#10b981" font-size="11">Checked (Always Evaluated)</text>
  </g>

  <!-- Child B: Article View (OnPush Strategy) -->
  <g transform="translate(590, 235)" filter="url(#shadow1b)">
    <rect width="260" height="76" rx="10" fill="#1e1e30" stroke="#e3a3ff" stroke-width="1.5"/>
    <text x="18" y="26" fill="#ffffff" font-size="14" font-weight="600">Article Content View</text>
    <text x="18" y="46" fill="#e3a3ff" font-size="12" font-family="monospace">OnPush Strategy</text>
    <text x="18" y="64" fill="#fbbf24" font-size="11">Dirty (Requires View Check)</text>
  </g>

  <!-- Flow Arrows to Leaves -->
  <path d="M 230 311 L 140 375" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowMuted1b)"/>
  <path d="M 330 311 L 340 375" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowMuted1b)"/>
  <path d="M 670 311 L 620 375" fill="none" stroke="#9678fb" stroke-width="2" marker-end="url(#arrow1b)"/>
  <path d="M 770 311 L 820 375" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowMuted1b)"/>

  <!-- Leaf Nodes (Evenly spread) -->
  <g transform="translate(50, 380)">
    <rect width="180" height="56" rx="8" fill="#161624" stroke="#2e2e42"/>
    <text x="14" y="24" fill="#cbd5e1" font-size="12" font-weight="600">SearchInput</text>
    <text x="14" y="44" fill="#64748b" font-size="11">Template Checked</text>
  </g>

  <g transform="translate(260, 380)">
    <rect width="180" height="56" rx="8" fill="#161624" stroke="#2e2e42"/>
    <text x="14" y="24" fill="#cbd5e1" font-size="12" font-weight="600">ThemeToggle</text>
    <text x="14" y="44" fill="#64748b" font-size="11">Template Checked</text>
  </g>

  <g transform="translate(520, 380)">
    <rect width="200" height="56" rx="8" fill="#161624" stroke="#9678fb" stroke-width="1.5"/>
    <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="600">LikeButton (Signal)</text>
    <text x="14" y="44" fill="#10b981" font-size="11">Binding Evaluated &amp; Mutated</text>
  </g>

  <g transform="translate(750, 380)">
    <rect width="200" height="56" rx="8" fill="#161624" stroke="#f43f5e" stroke-dasharray="4"/>
    <text x="14" y="24" fill="#fda4af" font-size="12" font-weight="600">CommentsList</text>
    <text x="14" y="44" fill="#f43f5e" font-size="11">Subtree Skipped</text>
  </g>

  <!-- Legend Bottom Centered -->
  <g transform="translate(50, 475)">
    <circle cx="10" cy="10" r="5" fill="#10b981"/>
    <text x="24" y="14" fill="#94a3b8" font-size="12">Checked View</text>

    <circle cx="180" cy="10" r="5" fill="#fbbf24"/>
    <text x="194" y="14" fill="#94a3b8" font-size="12">Dirty View</text>

    <line x1="330" y1="10" x2="360" y2="10" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3"/>
    <text x="370" y="14" fill="#94a3b8" font-size="12">Subtree Skipped (No Ref Change)</text>

    <circle cx="650" cy="10" r="5" fill="#9678fb"/>
    <text x="664" y="14" fill="#94a3b8" font-size="12">Targeted Signal Update</text>
  </g>
</svg>