<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" style="background:#0c0c16; font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141424"/>
      <stop offset="50%" stop-color="#0f0f1b"/>
      <stop offset="100%" stop-color="#090910"/>
    </linearGradient>
    <linearGradient id="brandLinear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9678fb"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="angularShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9678fb"/>
    </linearGradient>
    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9678fb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9678fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="460" fill="url(#coverBg)"/>

  <!-- Background Soft Radial Ambient Glows -->
  <circle cx="280" cy="230" r="320" fill="url(#pinkGlow)"/>
  <circle cx="920" cy="230" r="320" fill="url(#irisGlow)"/>

  <!-- Decorative Background Grid Lines (Subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="115" x2="1200" y2="115"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="345" x2="1200" y2="345"/>
    <line x1="300" y1="0" x2="300" y2="460"/>
    <line x1="600" y1="0" x2="600" y2="460"/>
    <line x1="900" y1="0" x2="900" y2="460"/>
  </g>

  <!-- Left: Stylized Angular Shield & Reactive Graph Nodes -->
  <g transform="translate(140, 130)">
    <!-- Shield Outline Glow -->
    <path d="M 100 0 L 190 32 L 175 140 L 100 185 L 25 140 L 10 32 Z" 
          fill="none" stroke="url(#angularShield)" stroke-width="4" filter="url(#glowFilter)" opacity="0.8"/>
    <!-- Shield Inner Fill -->
    <path d="M 100 10 L 180 38 L 166 132 L 100 172 L 34 132 L 20 38 Z" 
          fill="#171328" stroke="#37265a" stroke-width="2"/>
    <!-- Angular Stylized A -->
    <path d="M 100 45 L 140 135 L 120 135 L 108 108 L 92 108 L 80 135 L 60 135 Z M 100 78 L 95 95 L 105 95 Z" 
          fill="url(#brandLinear)"/>

    <!-- Orbiting Reactive Nodes -->
    <circle cx="215" cy="50" r="8" fill="#10b981" filter="url(#glowFilter)"/>
    <line x1="185" y1="42" x2="207" y2="48" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3"/>

    <circle cx="230" cy="140" r="10" fill="#9678fb" filter="url(#glowFilter)"/>
    <line x1="170" y1="135" x2="220" y2="139" stroke="#9678fb" stroke-width="1.5"/>

    <circle cx="-15" cy="100" r="9" fill="#f43f5e" filter="url(#glowFilter)"/>
    <line x1="15" y1="90" x2="-6" y2="98" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3"/>
  </g>

  <!-- Center-Right: Typography & Key Badges -->
  <g transform="translate(420, 135)">
    <!-- Badge -->
    <rect x="0" y="0" width="225" height="32" rx="16" fill="rgba(150, 120, 251, 0.15)" stroke="#9678fb" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#10b981"/>
    <text x="32" y="21" fill="#e3a3ff" font-size="12" font-weight="700" letter-spacing="1">DEEP DIVE INTERNALS</text>

    <!-- Main Title -->
    <text x="0" y="76" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5">
      Angular Change Detection
    </text>

    <!-- Gradient Subtitle -->
    <text x="0" y="116" fill="url(#brandLinear)" font-size="24" font-weight="700" letter-spacing="0.5">
      LView &amp; TView • OnPush • Signals &amp; Zoneless
    </text>

    <!-- Persian Explanatory Subtext (Clean LTR renderable or standard typography) -->
    <text x="0" y="152" fill="#94a3b8" font-size="15" font-weight="400">
      کالبدشکافی عمیق موتور Ivy، تخصیص حافظه در V8 و زمان‌بندی هوشمند در رندرهای مدرن
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="115" height="30" rx="6" fill="#181828" stroke="#2e2e46"/>
      <text x="57" y="19" fill="#cbd5e1" font-size="12" font-family="monospace" text-anchor="middle">Render3 / Ivy</text>

      <rect x="125" y="0" width="95" height="30" rx="6" fill="#181828" stroke="#2e2e46"/>
      <text x="172" y="19" fill="#cbd5e1" font-size="12" font-family="monospace" text-anchor="middle">Flat LView</text>

      <rect x="230" y="0" width="135" height="30" rx="6" fill="#181828" stroke="#2e2e46"/>
      <text x="297" y="19" fill="#cbd5e1" font-size="12" font-family="monospace" text-anchor="middle">Reactive Graph</text>

      <rect x="375" y="0" width="95" height="30" rx="6" fill="#181828" stroke="#2e2e46"/>
      <text x="422" y="19" fill="#cbd5e1" font-size="12" font-family="monospace" text-anchor="middle">Zoneless</text>
    </g>
  </g>

  <!-- Right Decorative Pulse Waves -->
  <g transform="translate(1030, 200)" opacity="0.6">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#9678fb" stroke-width="1.5" stroke-dasharray="4"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#9678fb" stroke-width="1.5" stroke-dasharray="6" opacity="0.5"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#9678fb" stroke-width="1" stroke-dasharray="8" opacity="0.25"/>
  </g>

  <!-- Clean Bottom Gradient Accent Line -->
  <rect x="0" y="456" width="1200" height="4" fill="url(#brandLinear)"/>
</svg>