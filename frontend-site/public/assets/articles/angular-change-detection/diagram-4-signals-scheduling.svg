<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="100%" height="100%" style="background:#0f0f17; border-radius:16px; font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="sigGrad4b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9678fb"/>
      <stop offset="100%" stop-color="#e3a3ff"/>
    </linearGradient>
    <marker id="flowArrow4b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9678fb"/>
    </marker>
  </defs>

  <!-- Title Left Aligned -->
  <text x="50" y="44" fill="#ffffff" font-size="19" font-weight="700">Signals Reactive Flow &amp; Zoneless Scheduling</text>
  <text x="50" y="68" fill="#94a3b8" font-size="13">Targeted view notification and microtask scheduling without Zone.js monkey-patching</text>

  <!-- Step 1: Signal Producer - x=50, width=195 -->
  <g transform="translate(50, 105)">
    <rect width="195" height="140" rx="10" fill="#1e1e30" stroke="#9678fb" stroke-width="2"/>
    <circle cx="28" cy="28" r="14" fill="#9678fb"/>
    <text x="24" y="33" fill="#ffffff" font-size="13" font-weight="700">1</text>
    <text x="52" y="32" fill="#ffffff" font-size="13" font-weight="700">Signal Producer</text>
    <rect x="14" y="58" width="167" height="68" rx="6" fill="#12121c"/>
    <text x="24" y="80" fill="#c084fc" font-family="monospace" font-size="12">count.set(5)</text>
    <text x="24" y="100" fill="#94a3b8" font-size="11">Value updated</text>
    <text x="24" y="116" fill="#94a3b8" font-size="11">Graph node marked</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 245 175 L 290 175" fill="none" stroke="#9678fb" stroke-width="2" marker-end="url(#flowArrow4b)"/>

  <!-- Step 2: Reactive Consumer - x=295, width=205 -->
  <g transform="translate(295, 105)">
    <rect width="205" height="140" rx="10" fill="#1e1e30" stroke="#9678fb" stroke-width="2"/>
    <circle cx="28" cy="28" r="14" fill="#9678fb"/>
    <text x="24" y="33" fill="#ffffff" font-size="13" font-weight="700">2</text>
    <text x="52" y="32" fill="#ffffff" font-size="13" font-weight="700">Reactive Consumer</text>
    <rect x="14" y="58" width="177" height="68" rx="6" fill="#12121c"/>
    <text x="22" y="78" fill="#38bdf8" font-family="monospace" font-size="10">ReactiveLViewConsumer</text>
    <text x="22" y="98" fill="#94a3b8" font-size="11">Dependency notified</text>
    <text x="22" y="114" fill="#fbbf24" font-size="11">Marks Target View Dirty</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 500 175 L 545 175" fill="none" stroke="#9678fb" stroke-width="2" marker-end="url(#flowArrow4b)"/>

  <!-- Step 3: Scheduler - x=550, width=205 -->
  <g transform="translate(550, 105)">
    <rect width="205" height="140" rx="10" fill="#1e1e30" stroke="#9678fb" stroke-width="2"/>
    <circle cx="28" cy="28" r="14" fill="#9678fb"/>
    <text x="24" y="33" fill="#ffffff" font-size="13" font-weight="700">3</text>
    <text x="52" y="32" fill="#ffffff" font-size="13" font-weight="700">Scheduler</text>
    <rect x="14" y="58" width="177" height="68" rx="6" fill="#12121c"/>
    <text x="22" y="78" fill="#34d399" font-family="monospace" font-size="10">ChangeDetectionScheduler</text>
    <text x="22" y="98" fill="#94a3b8" font-size="11">Schedules microtask</text>
    <text x="22" y="114" fill="#94a3b8" font-size="11">No Zone.js overhead</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 755 175 L 795 175" fill="none" stroke="#9678fb" stroke-width="2" marker-end="url(#flowArrow4b)"/>

  <!-- Step 4: DOM Refresh - x=800, width=150 -->
  <g transform="translate(800, 105)">
    <rect width="150" height="140" rx="10" fill="#142823" stroke="#10b981" stroke-width="2"/>
    <circle cx="28" cy="28" r="14" fill="#10b981"/>
    <text x="24" y="33" fill="#ffffff" font-size="13" font-weight="700">4</text>
    <text x="52" y="32" fill="#ffffff" font-size="13" font-weight="700">DOM Update</text>
    <rect x="12" y="58" width="126" height="68" rx="6" fill="#0d1f19"/>
    <text x="18" y="78" fill="#34d399" font-family="monospace" font-size="11">refreshView()</text>
    <text x="18" y="98" fill="#a7f3d0" font-size="11">Slot compared</text>
    <text x="18" y="114" fill="#a7f3d0" font-size="11">DOM mutated</text>
  </g>

  <!-- Comparison Box below - width 900 -->
  <g transform="translate(50, 275)">
    <rect width="900" height="210" rx="12" fill="#161624" stroke="#2e2e42"/>
    <text x="24" y="34" fill="#c084fc" font-size="15" font-weight="700">Key Architectural Insight: Signals vs Ivy View Tree</text>
    <text x="24" y="68" fill="#cbd5e1" font-size="13">1. Traditional Zone.js checked the entire view tree from the root on almost every asynchronous browser event.</text>
    <text x="24" y="102" fill="#cbd5e1" font-size="13">2. Signals provide a fine-grained reactive dependency graph that pinpoints the exact consumer view that became dirty.</text>
    <text x="24" y="136" fill="#cbd5e1" font-size="13">3. At rendering time, the compiled template function still evaluates binding expressions against prior LView slots to update the DOM.</text>
    <text x="24" y="174" fill="#94a3b8" font-size="12">Conclusion: Signals did not eliminate the Ivy rendering pipeline; they made change detection targeted, predictable, and fast.</text>
  </g>
</svg>