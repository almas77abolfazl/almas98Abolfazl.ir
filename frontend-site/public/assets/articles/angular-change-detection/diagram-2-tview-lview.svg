<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%" style="background:#0f0f17; border-radius:16px; font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="tviewGrad2b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f4d"/>
      <stop offset="100%" stop-color="#181330"/>
    </linearGradient>
    <linearGradient id="lviewGrad2b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a273b"/>
      <stop offset="100%" stop-color="#101826"/>
    </linearGradient>
    <marker id="mapArrow2b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <filter id="boxShadow2b" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Left Aligned -->
  <text x="50" y="44" fill="#ffffff" font-size="19" font-weight="700">Internal Architecture: TView vs LView in Ivy Engine</text>
  <text x="50" y="68" fill="#94a3b8" font-size="13">Static template blueprint vs runtime flat array instance and binding slots</text>

  <!-- Left: TView Container (Static Blueprint) - width 410 -->
  <g transform="translate(50, 100)" filter="url(#boxShadow2b)">
    <rect width="410" height="380" rx="14" fill="url(#tviewGrad2b)" stroke="#9678fb" stroke-width="2"/>
    <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="700">TView (Template View)</text>
    <text x="24" y="52" fill="#c084fc" font-size="12">Shared Static Blueprint (One per Component)</text>

    <!-- TView Items -->
    <g transform="translate(20, 72)">
      <rect width="370" height="58" rx="8" fill="#120e24" stroke="#4c3882"/>
      <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="600" font-family="monospace">data: TNode[]</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">Static DOM structure, tags, directives &amp; pipes</text>
    </g>

    <g transform="translate(20, 142)">
      <rect width="370" height="58" rx="8" fill="#120e24" stroke="#4c3882"/>
      <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="600" font-family="monospace">bindingStartIndex: 20</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">Offset for dynamic binding slots in LView</text>
    </g>

    <g transform="translate(20, 212)">
      <rect width="370" height="74" rx="8" fill="#120e24" stroke="#4c3882"/>
      <text x="16" y="22" fill="#ffffff" font-size="13" font-weight="600" font-family="monospace">templateFn: (rf, ctx) => ...</text>
      <text x="16" y="42" fill="#94a3b8" font-size="11">rf &amp; 1: Creation Mode (DOM creation)</text>
      <text x="16" y="60" fill="#94a3b8" font-size="11">rf &amp; 2: Update Mode (Dirty-check bindings)</text>
    </g>

    <g transform="translate(20, 298)">
      <rect width="370" height="54" rx="8" fill="#120e24" stroke="#4c3882"/>
      <text x="16" y="22" fill="#ffffff" font-size="13" font-weight="600" font-family="monospace">consts: [...]</text>
      <text x="16" y="42" fill="#94a3b8" font-size="11">Static attributes, class pools &amp; i18n messages</text>
    </g>
  </g>

  <!-- Right: LView Container (Runtime Flat Array) - width 430 -->
  <g transform="translate(520, 100)" filter="url(#boxShadow2b)">
    <rect width="430" height="380" rx="14" fill="url(#lviewGrad2b)" stroke="#38bdf8" stroke-width="2"/>
    <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="700">LView (Logical View - Flat Array)</text>
    <text x="24" y="52" fill="#38bdf8" font-size="12">Unique per Active Component Instance in Memory</text>

    <!-- Header Offset explanation slots -->
    <g transform="translate(20, 72)">
      <rect width="390" height="42" rx="6" fill="#0c1622" stroke="#1e3a5f"/>
      <text x="12" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">[0] TVIEW</text>
      <text x="130" y="26" fill="#94a3b8" font-size="11">Pointer to shared static TView</text>
    </g>

    <g transform="translate(20, 122)">
      <rect width="390" height="42" rx="6" fill="#0c1622" stroke="#1e3a5f"/>
      <text x="12" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">[1] FLAGS</text>
      <text x="130" y="26" fill="#94a3b8" font-size="11">LViewFlags: Dirty, Attached, OnPush</text>
    </g>

    <g transform="translate(20, 172)">
      <rect width="390" height="54" rx="6" fill="#0c1622" stroke="#1e3a5f"/>
      <text x="12" y="20" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">[2..7] CORE</text>
      <text x="130" y="20" fill="#94a3b8" font-size="11">Parent, Siblings, DeclView, Queries, DI</text>
      <text x="12" y="40" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">[8] CONTEXT</text>
      <text x="130" y="40" fill="#ffffff" font-size="11">Component Instance (this)</text>
    </g>

    <g transform="translate(20, 234)">
      <rect width="390" height="42" rx="6" fill="#0c1622" stroke="#1e3a5f"/>
      <text x="12" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">[9..19] HOST</text>
      <text x="130" y="26" fill="#94a3b8" font-size="11">Host node, Native DOM elements &amp; Hooks</text>
    </g>

    <g transform="translate(20, 284)">
      <rect width="390" height="76" rx="6" fill="#0f291e" stroke="#10b981" stroke-width="1.5"/>
      <text x="12" y="24" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">[20..N] BINDING SLOTS (HEADER_OFFSET)</text>
      <text x="12" y="44" fill="#a7f3d0" font-family="monospace" font-size="11">[20] = "Dashboard" (Previous evaluated value)</text>
      <text x="12" y="64" fill="#6ee7b7" font-size="11">Compared via ɵɵbindingUpdated() during Update Mode</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 460 130 C 490 130, 490 120, 520 120" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#mapArrow2b)"/>
  <path d="M 460 250 C 490 250, 490 390, 520 390" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4" marker-end="url(#mapArrow2b)"/>

  <!-- Footer explanation note Centered -->
  <text x="500" y="520" text-anchor="middle" fill="#64748b" font-size="12">
    Ivy Flat LView array enables direct CPU memory access and avoids garbage collection overhead.
  </text>
</svg>